services:
    db:
        image: postgres
        environment:
            POSTGRES_PASSWORD: labtest321
            POSTGRES_USER: dbuser
            POSTGRES_DB: labdb
        volumes:
            - db:/var/lib/postgresql/
        ports:
        - "5432:5432"
        networks:
            - db
        restart: always

networks:
    db:
        name: db-net
        external: true

volumes:
    db: